<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/collection.css?v=2">
</head>
<body>
  <header class="site-header">
    <div class="header-inner"></div>
  </header>
  <div id="mobile-nav" class="mobile-nav">
    <div class="mobile-nav-links"></div>
  </div>

  <!-- Error view -->
  <div id="error-view" class="error-view" style="display:none;">
    <div class="error-inner">
      <h1>Collection Not Found</h1>
      <p>This collection may have been removed or the link is incorrect.</p>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading-view" class="loading-view">
    <p>Loading collection...</p>
  </div>

  <!-- Collection View -->
  <div id="collection-view" style="display:none;">
    <div class="collection-header">
      <h1 id="collection-name"></h1>
    </div>
    <div id="gallery-grid" class="collection-gallery-grid"></div>
  </div>

  <script src="/js/header.js?v=1"></script>
  <script src="/js/collection.js?v=2"></script>
</body>
</html>
