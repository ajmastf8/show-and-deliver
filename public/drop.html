<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/css/style.css?v=0">
  <link rel="stylesheet" href="/css/proofing.css?v=0">
  <link rel="stylesheet" href="/css/drop.css?v=0">
  <link rel="stylesheet" href="/css/theme.css?v=0">
  <script src="/js/theme.js?v=0"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner"></div>
  </header>
  <div id="mobile-nav" class="mobile-nav">
    <div class="mobile-nav-links"></div>
  </div>

  <!-- Expired / Not Found -->
  <div id="error-view" class="error-view" style="display:none;">
    <div class="error-inner">
      <h1 id="error-title">Gallery Not Found</h1>
      <p id="error-message">This gallery may have been removed or the link is incorrect.</p>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading-view" class="loading-view">
    <p>Loading gallery...</p>
  </div>

  <!-- Password + email prompt -->
  <div id="password-view" class="password-view" style="display:none;">
    <div class="password-inner">
      <h1 id="password-gallery-name"></h1>
      <p>Enter the email you were invited with, and the password from your invitation.</p>
      <form id="password-form" class="password-form">
        <input type="email" id="drop-email" placeholder="Your invited email address" required autocomplete="email">
        <input type="password" id="gallery-password" placeholder="Password from your invitation" required autocomplete="current-password">
        <button type="submit" class="btn btn-primary">Enter</button>
      </form>
      <p id="password-error" class="error-text"></p>
    </div>
  </div>

  <!-- Gallery View -->
  <div id="gallery-view" style="display:none;">
    <header class="proofing-header">
      <h1 id="gallery-name"></h1>
      <div class="proofing-header-actions">
        <span id="viewer-display-name" class="viewer-name-badge"></span>
      </div>
    </header>

    <!-- The one thing a drop adds: an upload zone at the top. -->
    <div class="drop-add">
      <div class="drop-zone" id="drop-zone">
        <div class="dz-title">Drop files here</div>
        <div class="dz-hint" id="dz-hint">JPG, PNG, WEBP, GIF, MP4, MOV &middot; large files upload in chunks</div>
        <label class="btn btn-primary">
          Choose files
          <input type="file" id="drop-file" multiple hidden>
        </label>
      </div>
      <div id="drop-queue" class="drop-queue"></div>
    </div>

    <div id="video-list" class="proofing-video-list"></div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="proofing-lightbox" style="display:none;">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-container">
      <button class="lightbox-close-btn">&times;</button>
      <button class="lightbox-nav lightbox-prev" aria-label="Previous">&#8249;</button>
      <button class="lightbox-nav lightbox-next" aria-label="Next">&#8250;</button>
      <div class="lightbox-body">
        <div class="lightbox-video-side">
          <div class="lightbox-video-wrapper">
            <video id="lightbox-video" controls playsinline preload="auto" style="display:none;"></video>
            <img id="lightbox-photo" class="lightbox-photo" style="display:none;" alt="">
            <div id="lightbox-spinner" class="lightbox-spinner"></div>
          </div>
          <div class="lightbox-video-title">
            <h2 id="lightbox-title"></h2>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/header.js?v=0"></script>
  <script src="/js/drop.js?v=0"></script>
</body>
</html>
