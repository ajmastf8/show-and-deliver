<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=12">
  <link rel="stylesheet" href="/css/proofing.css?v=9">
</head>
<body>
  <header class="site-header">
    <div class="header-inner"></div>
  </header>
  <div id="mobile-nav" class="mobile-nav">
    <div class="mobile-nav-links"></div>
  </div>

  <!-- Expired / Not Found -->
  <div id="error-view" class="error-view" style="display:none;">
    <div class="error-inner">
      <h1 id="error-title">Gallery Not Found</h1>
      <p id="error-message">This gallery may have been removed or the link is incorrect.</p>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading-view" class="loading-view">
    <p>Loading gallery...</p>
  </div>

  <!-- Password Prompt -->
  <div id="password-view" class="password-view" style="display:none;">
    <div class="password-inner">
      <h1 id="password-gallery-name"></h1>
      <p>This gallery is password protected.</p>
      <form id="password-form" class="password-form">
        <input type="password" id="gallery-password" placeholder="Enter password" required>
        <button type="submit" class="btn btn-primary">Enter</button>
      </form>
      <p id="password-error" class="error-text"></p>
    </div>
  </div>

  <!-- Name Prompt Modal -->
  <div id="name-modal" class="name-modal" style="display:none;">
    <div class="name-modal-inner">
      <h2>Welcome</h2>
      <p>Please enter your name so your comments can be attributed to you.</p>
      <form id="name-form">
        <input type="text" id="viewer-name" placeholder="Your name" required>
        <button type="submit" class="btn btn-primary">Continue</button>
      </form>
    </div>
  </div>

  <!-- Download Notification Modal -->
  <div id="download-modal" class="name-modal" style="display:none;">
    <div class="name-modal-inner">
      <h2 id="download-modal-title">Downloading your photos</h2>
      <p id="download-modal-msg">Starting download&hellip;</p>
      <div class="download-progress">
        <div class="download-progress-bar" id="download-progress-bar"></div>
      </div>
      <p id="download-modal-detail" class="download-modal-detail"></p>
      <button type="button" id="download-cancel-btn" class="btn btn-secondary download-cancel-btn">Cancel</button>
    </div>
  </div>

  <!-- Gallery View -->
  <div id="gallery-view" style="display:none;">
    <header class="proofing-header">
      <h1 id="gallery-name"></h1>
      <div class="proofing-header-actions">
        <span id="viewer-display-name" class="viewer-name-badge"></span>
        <button id="download-all-btn" class="btn btn-primary" style="display:none;">Download All</button>
      </div>
    </header>

    <div id="video-list" class="proofing-video-list"></div>

  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="proofing-lightbox" style="display:none;">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-container">
      <button class="lightbox-close-btn">&times;</button>
      <button class="lightbox-nav lightbox-prev" aria-label="Previous">&#8249;</button>
      <button class="lightbox-nav lightbox-next" aria-label="Next">&#8250;</button>
      <div class="lightbox-body">
        <div class="lightbox-video-side">
          <div class="lightbox-video-wrapper">
            <video id="lightbox-video" controls playsinline preload="auto"></video>
            <img id="lightbox-photo" class="lightbox-photo" style="display:none;" alt="">
            <div id="lightbox-spinner" class="lightbox-spinner"></div>
          </div>
          <div class="lightbox-video-title">
            <h2 id="lightbox-title"></h2>
            <button id="lightbox-download-btn" class="btn btn-sm" style="display:none;">Download</button>
          </div>
        </div>
        <div class="lightbox-comments-side">
          <h3>Comments</h3>
          <div id="lightbox-comments" class="lightbox-comments-list"></div>
          <form id="comment-form" class="comment-form">
            <div class="comment-timestamp-display">
              Commenting at <span id="comment-time-display">0:00</span>
            </div>
            <textarea id="comment-text" placeholder="Leave a comment... (Enter to post, Shift+Enter for new line)" rows="3" required></textarea>
            <button type="submit" class="btn btn-primary btn-sm">Post Comment</button>
          </form>
          <div id="lightbox-send-review" class="lightbox-send-review" style="display:none;">
            <button id="lightbox-send-btn" class="btn btn-sm lightbox-send-btn">Finish &amp; Send Comments</button>
            <span id="lightbox-send-status" class="lightbox-send-status"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/header.js?v=1"></script>
  <script src="/js/zip-writer.js?v=2"></script>
  <script src="/js/proofing.js?v=20"></script>
</body>
</html>
